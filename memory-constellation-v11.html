        const STORAGE_KEY = 'memory-constellation-v11-state';
        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const state = JSON.parse(saved);
                    if (state.params) PARAMS = { ...PARAMS, ...state.params };
                }
            } catch (e) {}
        }
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ params: PARAMS }));
            } catch (e) {}
        }

        // ========== 工具函数 ==========
        function dateToZ(dateStr, stage) {
            const stageStart = new Date(stage.start + '-01');
            const stageEnd = new Date(stage.end + '-01');
            const stageDuration = stageEnd - stageStart;
            let targetDate;

            if (dateStr.includes('Q')) {
                const [year, quarter] = dateStr.split('Q');
                const month = (parseInt(quarter) - 1) * 3 + 1;
                targetDate = new Date(`${year}-${month.toString().padStart(2, '0')}-01`);
            } else if (dateStr.length === 8) {
                const year = dateStr.substring(0, 4);
                const month = dateStr.substring(4, 6);
                const day = dateStr.substring(6, 8);
                targetDate = new Date(`${year}-${month}-${day}`);
            } else {
                return (stage.zStart + stage.zEnd) / 2;
            }

            const dateOffset = targetDate - stageStart;
            const ratio = Math.max(0, Math.min(1, dateOffset / stageDuration));
            return stage.zStart + ratio * (stage.zEnd - stage.zStart);
        }

        function dateToTimestamp(dateStr) {
            if (dateStr.includes('Q')) {
                const [year, quarter] = dateStr.split('Q');
                const month = (parseInt(quarter) - 1) * 3 + 1;
                return new Date(`${year}-${month.toString().padStart(2, '0')}-01`).getTime();
            }
            return new Date(dateStr).getTime();
        }

        function dateToYear(dateStr) {
            if (dateStr.includes('Q')) {
                return parseInt(dateStr.split('Q')[0]);
            } else if (dateStr.length >= 4) {
                return parseInt(dateStr.substring(0, 4));
            }
            return null;
        }

        const LOCATION_BASE_POSITIONS = {};
        function getLocationBasePosition(location) {
            if (!LOCATION_BASE_POSITIONS[location]) {
                const hash = location.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
                const angle = (hash % 360) * (Math.PI / 180);
                const radius = 4 + (hash % 6);
                LOCATION_BASE_POSITIONS[location] = {
                    x: Math.cos(angle) * radius,
                    y: Math.sin(angle) * radius
                };
            }
            return LOCATION_BASE_POSITIONS[location];
        }

        function getFilteredMemories() {
            return MOCK_MEMORIES.filter(m => {
                if (FILTERS.emotions.size > 0 && !FILTERS.emotions.has(m.emotion.type)) return false;
                if (FILTERS.locations.size > 0 && !FILTERS.locations.has(m.location)) return false;
                return true;
            });
        }

        // 多项式拟合
        function polynomialFit(points, degree) {
            // 使用最小二乘法拟合多项式
            const n = points.length;
            if (n === 0) return [];

            const X = points.map(p => p.x);
            const Y = points.map(p => p.y);

            // 构建矩阵
            const matrix = [];
            const rhs = [];
            for (let i = 0; i <= degree; i++) {
                const row = [];
                for (let j = 0; j <= degree; j++) {
                    let sum = 0;
                    for (let k = 0; k < n; k++) {
                        sum += Math.pow(X[k], i + j);
                    }
                    row.push(sum);
                }
                matrix.push(row);

                let sum = 0;
                for (let k = 0; k < n; k++) {
                    sum += Y[k] * Math.pow(X[k], i);
                }
                rhs.push(sum);
            }

            // 高斯消元法求解
            const coeffs = gaussianElimination(matrix, rhs);
            return coeffs || [];
        }

        function gaussianElimination(A, b) {
            const n = A.length;
            const aug = A.map((row, i) => [...row, b[i]]);

            for (let i = 0; i < n; i++) {
                let maxRow = i;
                for (let k = i + 1; k < n; k++) {
                    if (Math.abs(aug[k][i]) > Math.abs(aug[maxRow][i])) {
                        maxRow = k;
                    }
                }
                [aug[i], aug[maxRow]] = [aug[maxRow], aug[i]];

                for (let k = i + 1; k < n; k++) {
                    const factor = aug[k][i] / aug[i][i];
                    for (let j = i; j <= n; j++) {
                        aug[k][j] -= factor * aug[i][j];
                    }
                }
            }

            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                x[i] = aug[i][n];
                for (let j = i + 1; j < n; j++) {
                    x[i] -= aug[i][j] * x[j];
                }
                x[i] /= aug[i][i];
            }

            return x;
        }

        function evaluatePolynomial(coeffs, x) {
            let sum = 0;
            for (let i = 0; i < coeffs.length; i++) {
                sum += coeffs[i] * Math.pow(x, i);
            }
            return sum;
        }

                    gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 256, 256);

                    const texture = new THREE.CanvasTexture(canvas);
                    const spriteMaterial = new THREE.SpriteMaterial({
                        map: texture,
                        transparent: true,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    const sprite = new THREE.Sprite(spriteMaterial);
                    sprite.position.set(x, y, z);

                    const baseScale = PARAMS.starSizeBase + PARAMS.starSizeIntensity * ((memory.emotion.intensity - 1) / 9);
                    sprite.scale.set(baseScale, baseScale, 1);

                    sprite.userData = { type: 'memory-star', memory };
                    galaxyGroup.add(sprite);
                    galaxyMemorySprites.push(sprite);
                });

                galaxyGroup.userData.memorySprites = galaxyMemorySprites;
                memorySprites.push(...galaxyMemorySprites);

                if (convexHullPoints.length >= 4) {
                    const centerZ = (stage.zStart + stage.zEnd) / 2;
                    const expandedPoints = convexHullPoints.map(p => {
                        const center = new THREE.Vector3(stage.centerPos.x, stage.centerPos.y, centerZ);
                        const dir = p.clone().sub(center).normalize();
                        return p.clone().add(dir.multiplyScalar(6));
                    });

                    try {
                        const convexGeometry = new ConvexGeometry(expandedPoints);
                        const edges = new THREE.EdgesGeometry(convexGeometry);
                        const lineMaterial = new THREE.LineDashedMaterial({
                            color: 0x6366f1,
                            transparent: true,
                            opacity: 0.3,
                            dashSize: 0.8,
                            gapSize: 0.4
                        });
                        const boundary = new THREE.LineSegments(edges, lineMaterial);
                        boundary.computeLineDistances();
                        galaxyGroup.add(boundary);

                        const hoverMesh = new THREE.Mesh(convexGeometry, new THREE.MeshBasicMaterial({
                            transparent: true,
                            opacity: 0,
                            side: THREE.DoubleSide,
                            depthWrite: false
                        }));
                        hoverMesh.userData = { type: 'galaxy-hitbox', galaxy: galaxyGroup };
                        scene.add(hoverMesh);
                        galaxyBoundingBoxes.push(hoverMesh);
                    } catch (e) {
                        console.warn('Convex hull failed for', stage.name);
                    }
                }

                scene.add(galaxyGroup);
                galaxies.push(galaxyGroup);
            });
        }

        function updateScene() {
            createGalaxies();
        }

        createGalaxies();

        // ========== 交互 ==========
        let hoveredGalaxy = null;

        canvas.addEventListener('mousemove', (event) => {
            if (currentView !== 'global') return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(galaxyBoundingBoxes);

            if (intersects.length > 0) {
                const galaxy = intersects[0].object.userData.galaxy;
                if (hoveredGalaxy !== galaxy) {
                    if (hoveredGalaxy) resetGalaxyHighlight(hoveredGalaxy);
                    hoveredGalaxy = galaxy;
                    highlightGalaxy(galaxy);
                    canvas.style.cursor = 'pointer';
                }
            } else {
                if (hoveredGalaxy) {
                    resetGalaxyHighlight(hoveredGalaxy);
                    hoveredGalaxy = null;
                    canvas.style.cursor = 'default';
                }
            }
        });

        function highlightGalaxy(galaxy) {
            galaxy.children.forEach(child => {
                if (child instanceof THREE.Points) {
                    child.material.opacity = 0.4;
                } else if (child instanceof THREE.LineSegments) {
                    child.material.opacity = 0.9;
                }
            });
        }

        function resetGalaxyHighlight(galaxy) {
            galaxy.children.forEach(child => {
                if (child instanceof THREE.Points) {
                    child.material.opacity = PARAMS.bgOpacity;
                } else if (child instanceof THREE.LineSegments) {
                    child.material.opacity = 0.3;
                }
            });
        }

        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (currentView === 'global') {
                const intersects = raycaster.intersectObjects(galaxyBoundingBoxes);
                if (intersects.length > 0) {
                    const galaxy = intersects[0].object.userData.galaxy;
                    zoomToGalaxy(galaxy);
                }
            } else if (currentView === 'stage') {
                if (selectedGalaxy) {
                    const sprites = selectedGalaxy.userData.memorySprites;
                    if (sprites) {
                        const intersects = raycaster.intersectObjects(sprites);
                        if (intersects.length > 0) {
                            const sprite = intersects[0].object;
                            const memory = sprite.userData.memory;
                            if (memory) {
                                showMemoryDetail(memory);
                            }
                        }
                    }
                }
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') returnToGlobal();
        });

        function zoomToGalaxy(galaxy) {
            selectedGalaxy = galaxy;
            currentView = 'stage';

            const stage = galaxy.userData.stage;
            const centerZ = (stage.zStart + stage.zEnd) / 2;
            const endPos = new THREE.Vector3(stage.centerPos.x, stage.centerPos.y + 30, centerZ + 40);
            const endTarget = new THREE.Vector3(stage.centerPos.x, stage.centerPos.y, centerZ);

            animateCamera(camera.position.clone(), controls.target.clone(), endPos, endTarget, PARAMS.cameraMoveSpeed);

            // V11新增：进入阶段时创建时间轴
            createTimeAxis(stage);

            document.querySelectorAll('.stage-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.stage === stage.name);
            });
        }

        function returnToGlobal() {
            currentView = 'global';
            selectedGalaxy = null;
            selectedMemory = null;

            const endPos = new THREE.Vector3(0, 60, 250);
            const endTarget = new THREE.Vector3(0, 0, 114);

            animateCamera(camera.position.clone(), controls.target.clone(), endPos, endTarget, PARAMS.cameraMoveSpeed);

            // V11新增：返回全局视图时移除时间轴
            removeTimeAxis();

            document.querySelectorAll('.stage-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('similar-memories').classList.remove('active');
            document.getElementById('memory-editor').disabled = true;
            document.getElementById('memory-editor').value = '';
            document.getElementById('editor-meta').textContent = '';
        }

        function animateCamera(startPos, startTarget, endPos, endTarget, duration) {
            const startTime = Date.now();
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                camera.position.lerpVectors(startPos, endPos, eased);
                controls.target.lerpVectors(startTarget, endTarget, eased);

                if (progress < 1) requestAnimationFrame(animate);
            }
            animate();
        }

        function showMemoryDetail(memory) {
            selectedMemory = memory;

            const editor = document.getElementById('memory-editor');
            editor.value = memory.content;
            editor.disabled = false;

            const meta = document.getElementById('editor-meta');
            meta.innerHTML = `
                <span>${memory.song}</span>
                <span>•</span>
                <span>${memory.date}</span>
                <span>•</span>
                <span>${memory.location}</span>
            `;

            showSimilarMemories(memory);
        }

        function showSimilarMemories(memory) {
            const similarSection = document.getElementById('similar-memories');
            similarSection.innerHTML = ''; // 清空内容

            const sameLocation = getFilteredMemories().filter(m =>
                m.location === memory.location && m.song !== memory.song
            ).slice(0, 5);

            const sameEmotion = getFilteredMemories().filter(m =>
                m.emotion.type === memory.emotion.type && m.song !== memory.song
            ).slice(0, 5);

            const sameStage = getFilteredMemories().filter(m =>
                m.stage === memory.stage && m.song !== memory.song
            ).slice(0, 5);

            // 只在有任意一个维度有相似记忆时才显示
            if (sameLocation.length > 0 || sameEmotion.length > 0 || sameStage.length > 0) {
                similarSection.classList.add('active');

                // 方案10紧凑表格布局：只添加有数据的行
                if (sameLocation.length > 0) {
                    const label = document.createElement('span');
                    label.className = 'similar-label';
                    label.textContent = '同地点';
                    similarSection.appendChild(label);

                    const links = document.createElement('div');
                    links.className = 'similar-links';
                    sameLocation.forEach(m => {
                        const link = document.createElement('button');
                        link.className = 'similar-link';
                        link.textContent = m.song;
                        link.onclick = () => showMemoryDetail(m);
                        links.appendChild(link);
                    });
                    similarSection.appendChild(links);
                }

                if (sameEmotion.length > 0) {
                    const label = document.createElement('span');
                    label.className = 'similar-label';
                    label.textContent = '同情绪';
                    similarSection.appendChild(label);

                    const links = document.createElement('div');
                    links.className = 'similar-links';
                    sameEmotion.forEach(m => {
                        const link = document.createElement('button');
                        link.className = 'similar-link';
                        link.textContent = m.song;
                        link.onclick = () => showMemoryDetail(m);
                        links.appendChild(link);
                    });
                    similarSection.appendChild(links);
                }

                if (sameStage.length > 0) {
                    const label = document.createElement('span');
                    label.className = 'similar-label';
                    label.textContent = '同阶段';
                    similarSection.appendChild(label);

                    const links = document.createElement('div');
                    links.className = 'similar-links';
                    sameStage.forEach(m => {
                        const link = document.createElement('button');
                        link.className = 'similar-link';
                        link.textContent = m.song;
                        link.onclick = () => showMemoryDetail(m);
                        links.appendChild(link);
                    });
                    similarSection.appendChild(links);
                }
            } else {
                // 没有相似记忆时隐藏整个区域
                similarSection.classList.remove('active');
            }
        }

        document.getElementById('memory-editor').addEventListener('blur', () => {
            if (selectedMemory) {
                const newContent = document.getElementById('memory-editor').value;
                selectedMemory.content = newContent;
                console.log('Memory saved:', selectedMemory);
            }
        });

        // ========== V11核心改动：情绪总结图表（热力图矩阵） ==========
        const chartCanvas = document.getElementById('emotion-chart');
        const chartCtx = chartCanvas.getContext('2d');

        function updateEmotionChart() {
            const memories = getFilteredMemories().sort((a, b) => dateToTimestamp(a.date) - dateToTimestamp(b.date));

            const dpr = window.devicePixelRatio;
            const w = chartCanvas.width = chartCanvas.clientWidth * dpr;
            const h = chartCanvas.height = chartCanvas.clientHeight * dpr;
            chartCtx.clearRect(0, 0, w, h);

            if (memories.length === 0) return;

            const padding = { top: 20 * dpr, right: 15 * dpr, bottom: 30 * dpr, left: 60 * dpr };
            const chartW = w - padding.left - padding.right;
            const chartH = h - padding.top - padding.bottom;

            const minYear = 2007;
            const maxYear = 2027;

            // 按年分桶统计
            const yearlyData = {};
            Object.keys(EMOTION_NAMES).forEach(type => {
                yearlyData[type] = {};
                for (let year = minYear; year <= maxYear; year++) {
                    yearlyData[type][year] = 0;
                }
            });

            memories.forEach(m => {
                const year = dateToYear(m.date);
                if (year && year >= minYear && year <= maxYear) {
                    yearlyData[m.emotion.type][year]++;
                }
            });

            const emotions = Object.keys(EMOTION_NAMES);
            const years = [];
            for (let y = minYear; y <= maxYear; y++) years.push(y);

            const cellW = chartW / years.length;
            const cellH = chartH / emotions.length;

            // 找出最大值用于归一化
            let maxCount = 0;
            emotions.forEach(emotion => {
                years.forEach(year => {
                    const count = yearlyData[emotion][year];
                    if (count > maxCount) maxCount = count;
                });
            });

            // 绘制矩阵
            emotions.forEach((emotion, j) => {
                years.forEach((year, i) => {
                    const count = yearlyData[emotion][year];
                    const x = padding.left + i * cellW;
                    const y = padding.top + j * cellH;

                    // 转换颜色
                    const colorHex = EMOTION_COLORS[emotion];
                    const threeColor = new THREE.Color(colorHex);
                    const r = Math.floor(threeColor.r * 255);
                    const g = Math.floor(threeColor.g * 255);
                    const b = Math.floor(threeColor.b * 255);

                    const intensity = maxCount > 0 ? count / maxCount : 0;

                    chartCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${intensity * 0.9})`;
                    chartCtx.fillRect(x, y, cellW, cellH);

                    chartCtx.strokeStyle = '#fff';
                    chartCtx.lineWidth = 0.5 * dpr;
                    chartCtx.strokeRect(x, y, cellW, cellH);

                    // 数字标注
                    if (count > 0) {
                        chartCtx.fillStyle = intensity > 0.5 ? '#fff' : '#000';
                        chartCtx.font = `${7 * dpr}px Arial`;
                        chartCtx.textAlign = 'center';
                        chartCtx.textBaseline = 'middle';
                        chartCtx.fillText(count, x + cellW / 2, y + cellH / 2);
                    }
                });
            });

            // Y轴标签（情绪名称）
            chartCtx.fillStyle = '#000';
            chartCtx.font = `${8 * dpr}px Arial`;
            chartCtx.textAlign = 'right';
            chartCtx.textBaseline = 'middle';
            emotions.forEach((emotion, j) => {
                const y = padding.top + j * cellH + cellH / 2;
                chartCtx.fillText(EMOTION_NAMES[emotion], padding.left - 6 * dpr, y);
            });

            // X轴标签
            chartCtx.textAlign = 'center';
            chartCtx.textBaseline = 'top';
            years.forEach((year, i) => {
                if (i % 3 === 0) {
                    const x = padding.left + i * cellW + cellW / 2;
                    chartCtx.fillText(year, x, h - padding.bottom + 4 * dpr);
                }
            });
        }

        updateEmotionChart();

        // ========== 分隔符拖拽 ==========
        let splitterDrag = null;

        document.getElementById('splitter-v').addEventListener('mousedown', (e) => {
            splitterDrag = {
                type: 'vertical',
                startX: e.clientX,
                startWidth: document.getElementById('right-panel').clientWidth
            };
            document.body.style.cursor = 'col-resize';
            document.getElementById('splitter-v').classList.add('dragging');
            e.preventDefault();
        });

        document.getElementById('splitter-h').addEventListener('mousedown', (e) => {
            splitterDrag = {
                type: 'horizontal',
                startY: e.clientY,
                startHeight: document.getElementById('top-section').clientHeight
            };
            document.body.style.cursor = 'row-resize';
            document.getElementById('splitter-h').classList.add('dragging');
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!splitterDrag) return;

            if (splitterDrag.type === 'vertical') {
                const delta = splitterDrag.startX - e.clientX;
                const newWidth = Math.max(280, Math.min(splitterDrag.startWidth + delta, window.innerWidth - 300));
                document.getElementById('right-panel').style.width = newWidth + 'px';
                updateRendererSize();
                updateEmotionChart();
            } else {
                const delta = e.clientY - splitterDrag.startY;
                const newHeight = Math.max(140, splitterDrag.startHeight + delta);
                document.getElementById('top-section').style.flex = `0 0 ${newHeight}px`;
                updateEmotionChart();
            }
        });

        document.addEventListener('mouseup', () => {
            if (splitterDrag) {
                document.body.style.cursor = '';
                document.querySelectorAll('.splitter-vertical, .splitter-horizontal').forEach(s => s.classList.remove('dragging'));
                splitterDrag = null;
            }
        });

        // ========== 动画循环 ==========
        function animate() {
            requestAnimationFrame(animate);
            galaxies.forEach(g => g.rotation.z += 0.0002);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ========== 窗口调整 ==========
        window.addEventListener('resize', () => {
            updateRendererSize();
            updateEmotionChart();
        });

        // ========== 初始化 ==========
        initFilters();
        initParams();
        initStageNav();
    </script>
</body>
</html>
