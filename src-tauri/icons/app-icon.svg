    <linearGradient id="evening" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EE8C1"/><stop offset="1" stop-color="#37C5B4"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B8A4FF"/><stop offset="1" stop-color="#7068E9"/></linearGradient>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="120" fill="#FFFFFF"/>
