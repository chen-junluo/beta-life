  <circle cx="426" cy="735" r="24" fill="#34D399"/><path d="M415 735l9 9 20-23" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="727" width="145" height="15" rx="7" fill="#CBD5E1"/>
  <rect x="437" y="798" width="150" height="13" rx="6" fill="#EEF2FF"/>
