<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Beta Period Crown</title>
  <desc id="desc">Three time-of-day cards form a colorful crown behind a central Beta planner.</desc>
  <defs>
    <linearGradient id="morning" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FDBA2D"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
    <linearGradient id="afternoon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="22" stdDeviation="19" flood-color="#475569" flood-opacity=".24"/></filter>
  </defs>
  <g transform="translate(92 92) scale(.82)">
  <rect width="1024" height="1024" rx="232" fill="#FFFFFF"/>
