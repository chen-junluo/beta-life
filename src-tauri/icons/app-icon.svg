    <rect x="405" y="190" width="214" height="346" rx="44" fill="url(#afternoon)"/>
    <rect x="452" y="252" width="120" height="15" rx="7" fill="#CCFBF1"/><rect x="452" y="293" width="88" height="12" rx="6" fill="#A7F3D0"/><path d="M453 393l31 31 68-76" fill="none" stroke="#FFFFFF" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(12 713 395)"><rect x="606" y="236" width="214" height="318" rx="44" fill="url(#night)"/><circle cx="706" cy="351" r="53" fill="#F8FAFC"/><circle cx="730" cy="329" r="53" fill="#695CE3"/></g>
    <rect x="323" y="422" width="378" height="436" rx="64" fill="#FFFFFF"/>
  </g>
  <text x="512" y="561" text-anchor="middle" fill="#4338CA" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-5">Beta</text>
