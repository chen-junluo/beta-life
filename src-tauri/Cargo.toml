[package]
name = "beta-life"
version = "0.5.0"
description = "A long-term life rhythm board"
authors = ["Dylan Chen"]
edition = "2021"

[lib]
name = "beta_life_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
